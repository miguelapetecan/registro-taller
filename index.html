<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de taller</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#14171c;--mu:#6b7280;--bd:#e5e7eb;--ac:#ea580c;--acbg:#fff7ed;--red:#dc2626;--redbg:#fef2f2;--grn:#15803d;--grnbg:#f0fdf4;--hd:#111318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--hd);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;flex:1;min-width:160px}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--ac);display:grid;place-items:center;font-style:normal;font-size:17px}
nav{display:flex;gap:4px}
nav button{background:transparent;color:#cbd5e1;border:0;padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer}
nav button.on{color:#fff;background:#272b34}
nav button.new{background:var(--ac);color:#fff;font-weight:600}
main{max-width:880px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{margin:6px 0 14px;font-size:22px}
h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.step{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;display:grid;place-items:center;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;font-weight:500}
input,textarea{width:100%;font:inherit;color:var(--tx);background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #fed7aa}
textarea{resize:vertical;min-height:90px}
input.plate-in{font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
details{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--ac);margin-bottom:10px}
.btn{font:inherit;border:1px solid #d1d5db;background:#fff;color:var(--tx);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#9ca3af}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.muted{color:var(--mu)}.small{font-size:13px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{aspect-ratio:4/3;border:2px dashed #d1d5db;border-radius:12px;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;background:#fafafa;text-align:center;color:var(--mu);font-weight:500;padding:8px}
.ph:hover{border-color:var(--ac);color:var(--ac)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph em{font-size:30px;display:block;font-style:normal}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.xi{position:relative}.xi img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:#e5e7eb;cursor:zoom-in}
.xi input{margin-top:4px;padding:6px 8px;font-size:13px}
.rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(220,38,38,.92);color:#fff;font-size:14px;cursor:pointer;z-index:3;line-height:1}
.dmg{border:1px solid #fecaca;border-radius:12px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:120px 1fr;gap:10px;background:#fffafa}
.dmg .dph{aspect-ratio:4/3;border:2px dashed #d1d5db;border-radius:10px;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;font-size:12px;color:var(--mu);text-align:center;background:#fff;padding:4px}
.dmg .dph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dmg .dn{font-weight:600;font-size:13px;color:var(--red);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.dmg textarea{min-height:64px}
.dview{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.dview:last-child{border-bottom:0}.dview img{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none}
@media(max-width:560px){.dmg{grid-template-columns:96px 1fr}.dview img{width:96px}}
.ph .del{position:absolute;bottom:8px;left:8px;background:rgba(220,38,38,.92);color:#fff;font:600 12px/1 system-ui,sans-serif;padding:6px 11px;border-radius:99px;z-index:3;border:0;cursor:pointer}
.ph .chg{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 9px;border-radius:99px;z-index:2}
.ai{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f9fafb;font-size:14px}
.ai.ok{background:var(--grnbg);color:var(--grn)}.ai.err{background:var(--redbg);color:var(--red)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fdba74;border-top-color:var(--ac);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-weight:600}
.toggle button.on.no{background:var(--grnbg);border-color:var(--grn);color:var(--grn)}
.toggle button.on.si{background:var(--redbg);border-color:var(--red);color:var(--red)}
.plate{display:inline-flex;align-items:stretch;border:2px solid #111;border-radius:6px;overflow:hidden;background:#fff;color:#111;font-family:"Arial Narrow",Arial,sans-serif;flex:none}
.plate::before{content:"E";background:#1d4ed8;color:#fff;font-size:10px;font-weight:700;padding:0 4px 2px;display:flex;align-items:flex-end}
.plate b{padding:2px 8px;font-size:17px;letter-spacing:1px}
.plate.big b{font-size:26px;padding:4px 12px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.in{background:var(--acbg);color:var(--ac)}.tag.out{background:var(--grnbg);color:var(--grn)}.tag.red{background:var(--redbg);color:var(--red)}
.search{position:relative;margin-bottom:12px}
.search input{padding:13px 14px 13px 42px;font-size:16px;border-radius:12px}
.search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chips button{font:inherit;border:1px solid #d1d5db;background:#fff;padding:7px 14px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.item{display:flex;gap:14px;align-items:center;cursor:pointer;padding:12px}
.item:hover{border-color:var(--ac)}
.thumb{width:84px;height:63px;border-radius:9px;background:#e5e7eb;object-fit:cover;flex:none;display:grid;place-items:center;font-size:24px}
.item .info{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.empty{text-align:center;padding:40px 16px}
.empty em{font-size:46px;display:block;font-style:normal;margin-bottom:6px}
.hist{border-color:#fdba74;background:var(--acbg)}
.hist h3{color:#9a3412}
.sum{background:#fff;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.visits{list-style:none;margin:0;padding:0}
.visits li{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;display:grid;gap:2px}
.visits .vd{font-size:13px;color:var(--mu);font-weight:600}
.link{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;cursor:pointer;padding:0;justify-self:start}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin:0}
.dl div{border-bottom:1px solid var(--bd);padding-bottom:6px}
.dl dt{font-size:12px;color:var(--mu)}.dl dd{margin:0;font-weight:500;word-break:break-word}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#e5e7eb}
.gal figure{margin:0}.gal figcaption{font-size:12px;color:var(--mu);margin-top:4px}
.note{white-space:pre-wrap}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:50;cursor:zoom-out;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--hd);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){.photos{grid-template-columns:1fr 1fr}nav button{padding:8px 9px;font-size:14px}.brand span{display:none}.thumb{width:64px;height:48px}}
@media print{header,.actions,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>🔧</i><span>Registro de taller</span></div>
  <nav>
    <button data-nav="list">Entradas</button>
    <button data-nav="new" class="new">+ Nueva entrada</button>
    <button data-nav="settings">⚙︎</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normP=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=iso=>iso?new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fmtD=iso=>iso?new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const short=(s,n)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s};
const toLocalInput=iso=>{const d=iso?new Date(iso):new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const fromLocalInput=v=>v?new Date(v).toISOString():new Date().toISOString();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function lightbox(src){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${src}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
const store={get(k,d=''){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- base de datos local (IndexedDB) ---------- */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('registroTaller',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('entradas',{keyPath:'id'});d.createObjectStore('fotos',{keyPath:'id'})};
    r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{const q=fn(DB.db.transaction(store,mode).objectStore(store));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  all(s){return DB.req(s,'readonly',o=>o.getAll())},
  get(s,id){return DB.req(s,'readonly',o=>o.get(id))},
  put(s,v){return DB.req(s,'readwrite',o=>o.put(v))},
  del(s,id){return DB.req(s,'readwrite',o=>o.delete(id))}
};
let ENT=[];
const urlCache={};
async function photoURL(id){if(!id)return null;if(urlCache[id])return urlCache[id];const f=await DB.get('fotos',id);if(!f)return null;return urlCache[id]=URL.createObjectURL(f.blob)}

/* ---------- campos ---------- */
const PRIMARY=[['marca','Marca'],['modelo','Modelo'],['anio','Año']];
const FICHA=[
  ['bastidor','Bastidor (VIN) · E'],['color','Color'],['tipo','Tipo / variante / versión · D.2'],
  ['fecha_primera_matriculacion','1ª matriculación · B'],['fecha_matriculacion','Fecha matriculación · I'],
  ['fecha_expedicion','Fecha expedición · I.1'],['lugar_expedicion','Lugar expedición · I.2'],['validez','Periodo de validez · H'],
  ['homologacion','Nº homologación · K'],['servicio','Servicio · D.4'],['cilindrada','Cilindrada cm³ · P.1'],
  ['potencia','Potencia kW · P.2'],['combustible','Combustible · P.3'],['masa_max_tecnica','Masa máx. técnica kg · F.1'],
  ['masa_max_circulacion','Masa máx. circulación kg · F.2'],['masa_servicio','Masa en servicio kg · G'],
  ['plazas','Plazas asiento · S.1'],['plazas_pie','Plazas de pie · S.2'],['proxima_itv','Próxima ITV'],['km_documento','Km según documento'],
  ['clasificacion','Clasificación'],['tara','Tara kg'],['neumaticos','Neumáticos'],['motor_marca','Marca del motor'],['codigo_motor','Código de motor'],
  ['cilindros','Nº de cilindros'],['potencia_fiscal','Potencia fiscal CV'],['longitud','Longitud mm'],['anchura','Anchura mm'],['altura','Altura mm'],['fecha_ficha','Fecha de la ficha técnica']
];
const VKEYS=['matricula',...PRIMARY.map(x=>x[0]),...FICHA.map(x=>x[0])];
const LABEL=Object.fromEntries([['matricula','Matrícula'],...PRIMARY,...FICHA]);

/* ---------- lector OCR open source (Tesseract.js) ---------- */
let OCRW=null,OCR_PROG=null;
function ocrWorker(){
  if(!window.Tesseract)return Promise.reject(new Error('no se pudo cargar el lector (la primera vez necesita internet)'));
  if(!OCRW)OCRW=Tesseract.createWorker('spa',1,{logger:m=>{if(m.status==='recognizing text'&&OCR_PROG)OCR_PROG(m.progress)}}).catch(e=>{OCRW=null;throw e});
  return OCRW;
}
async function prepImg(blob,deg=0,minSide=1600){
  const bmp=await createImageBitmap(blob);
  const big=Math.max(bmp.width,bmp.height);
  const s=Math.min(2600/big,Math.max(1,minSide/big));
  const w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
  const rot=deg%180!==0;
  const c=document.createElement('canvas');c.width=rot?h:w;c.height=rot?w:h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.filter='grayscale(1) contrast(1.5)';
  x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(bmp,-w/2,-h/2,w,h);
  return c;
}
async function ocrText(canvas,psm,whitelist=''){
  const w=await ocrWorker();
  await w.setParameters({tessedit_pageseg_mode:String(psm),preserve_interword_spaces:'1',tessedit_char_whitelist:whitelist});
  const {data}=await w.recognize(canvas);
  return data.text||'';
}

/* matrícula española: 0000XXX (actual) o X(X)-0000-X(X) (antigua) */
const toDig=s=>s.replace(/[OQDU]/g,'0').replace(/[IL|!T]/g,'1').replace(/Z/g,'2').replace(/S/g,'5').replace(/B/g,'8').replace(/G/g,'6').replace(/A/g,'4');
const toLet=s=>s.replace(/8/g,'B').replace(/5/g,'S').replace(/2/g,'Z').replace(/6/g,'G').replace(/0/g,'D').replace(/1/g,'J').replace(/4/g,'A');
function findPlate(text){
  const T=stripEU(String(text||'').toUpperCase().replace(/[‐-―·•]/g,'-'));
  const re=/(?<![A-Z0-9])([0-9OQDUILSZBGAT|!]{4})[\s-]{0,2}([A-Z0-9]{3})(?![A-Z0-9])/g;
  let m;
  while((m=re.exec(T))){const p=toDig(m[1])+toLet(m[2]);if(/^\d{4}[BCDFGHJKLMNPRSTVWXYZ]{3}$/.test(p)&&/\d/.test(m[1]))return p}
  const old=/(?<![A-Z0-9])([A-Z]{1,2})[\s-]{0,2}(\d{4})[\s-]{0,2}([A-Z]{1,2})(?![A-Z0-9])/;
  const o=T.match(old);if(o&&o[1][0]!=='E')return o[1]+o[2]+o[3];
  return '';
}
/* la "E" de la franja azul (y las estrellas) no forma parte de la matrícula */
function stripEU(T){return T.replace(/(^|[^A-Z0-9])[E€]\s*[-.,:*]?\s*(?=[0-9OQDILSZBG]{4}\s*-?\s*[A-Z0-9]{3}(?![A-Z0-9]))/g,'$1 ')}
function cleanPlate(p){
  p=normP(p);if(/^E\d{4}[BCDFGHJKLMNPRSTVWXYZ]{3}$/.test(p))p=p.slice(1);
  return /^(\d{4}[BCDFGHJKLMNPRSTVWXYZ]{3}|[A-DF-Z][A-Z]?\d{4}[A-Z]{1,2})$/.test(p)?p:(findPlate(p)||p);
}

/* permiso de circulación / ficha técnica */
const CODES={A:'matricula',B:'fecha_primera_matriculacion',C11:'_apellidos',C12:'_nombre',D1:'marca',D2:'tipo',D3:'modelo',D4:'servicio',E:'bastidor',F1:'masa_max_tecnica',F2:'masa_max_circulacion',G:'masa_servicio',H:'validez',I:'fecha_matriculacion',I1:'fecha_expedicion',I2:'lugar_expedicion',K:'homologacion',P1:'cilindrada',P2:'potencia',P3:'combustible',S1:'plazas',S2:'plazas_pie'};
const fixDate=s=>{const m=String(s).match(/(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{4})/);return m?`${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}-${m[3]}`:''};
const firstNum=s=>{const m=String(s).replace(/(\d)[.\s](\d{3})(?!\d)/g,'$1$2').match(/\d+(?:[.,]\d+)?/);return m?m[0].replace(',','.'):''};
function parseFicha(text){
  const d={};
  const lines=text.split('\n').flatMap(l=>l.split(/\s{3,}|\s(?=[\(\[]?[CDFIPS]\s?[.,]\s?\d[\)\]]?\s)/)).map(l=>l.trim()).filter(Boolean);
  const re=/^[\(\[\{|]?\s*([ABCDEFGHIKPS])\s*[.,:]?\s*(\d)?\s*[.,:]?\s*(\d)?\s*[\)\]\}|]?\s*[:\-]?\s+(.+)$/;
  for(const l of lines){
    const m=l.match(re);if(!m)continue;
    const k=CODES[m[1]+(m[2]||'')+(m[3]||'')];if(!k||d[k])continue;
    let v=m[4].replace(/\s*[-—_–=]{3,}.*$/,'').trim();
    if(!v||/^[-—_–=.\s]+$/.test(v))continue;
    d[k]=v;
  }
  const flat=text.toUpperCase();
  heuristics(d,text);
  // matrícula
  d.matricula=findPlate(d.matricula||'')||findPlate(flat);
  // bastidor
  const vinSrc=((d.bastidor||'').replace(/\s/g,'')+'\n'+flat).replace(/[OQ]/g,'0');
  const vin=vinSrc.match(/(?<![A-Z0-9])[A-HJ-NPR-Z0-9]{17}(?![A-Z0-9])/);
  d.bastidor=vin?vin[0]:(d.bastidor||'').replace(/\s/g,'');
  // fechas
  for(const k of ['fecha_primera_matriculacion','fecha_matriculacion','fecha_expedicion','validez'])if(d[k])d[k]=fixDate(d[k])||(k==='validez'?d[k]:'');
  // números
  for(const k of ['cilindrada','potencia','masa_max_tecnica','masa_max_circulacion','masa_servicio','plazas','plazas_pie'])if(d[k])d[k]=firstNum(d[k]);
  // combustible
  const fuel=(d.combustible||flat).match(/DI[EÉ]SEL|GASOLINA|GASOIL|EL[EÉ]CTRIC[OA]|H[IÍ]BRID[OA]|GLP|GNC/);
  d.combustible=fuel?fuel[0].replace('É','E').replace('GASOIL','DIESEL'):(d.combustible||'');
  // cliente
  d.cliente=[cleanName(d._nombre),cleanName(d._apellidos)].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();delete d._nombre;delete d._apellidos;
  // observaciones
  const itv=flat.match(/PR[OÓ0]XIMA\s*I\.?T\.?V\.?\s*[:.]?\s*(\d{1,2}\s*[-\/.]\s*\d{1,2}\s*[-\/.]\s*\d{4})/);if(itv)d.proxima_itv=fixDate(itv[1]);

function fixModel(s){
  s=String(s||'').toUpperCase().split(/\s(?:V[IÍ1]A\b|ANCH|ALTUR|LONG)|\|/)[0];

  const votes={};

function plateFromLine(text){

async function readVehiclePlate(blob,onStatus){

function docCanvas(bmp,deg,mode){

const DOC_WORDS=/DOCUMENTO|V[AÁ]LIDO|I\.?T\.?V|KILOMETRAJE|PR[OÓ]XIMA|OBSERVACIONES|MARCA|VARIANTE|DENOMINACI|COMERCIAL|TARA|NEUM[AÁ]TICOS|ASIENTOS|CILIND|POTENCIA|TURISMO|DI[EÉ]SEL|GASOLINA|ALTURA|ANCHURA|LONGITUD|HOMOLOGA|VEH[IÍ]CULO|ESPECIFICAR|FIRMA/g;

async function readDocument(blob,onStatus){
  const bmp=await createImageBitmap(blob);

const GEM_PROMPT=`Eres un mecánico de un taller español. Transcribe con exactitud los datos de las fotos (foto del vehículo y/o documento: permiso de circulación o ficha técnica / tarjeta ITV). No inventes nada: si un dato no se ve o no es legible, deja "".
Devuelve SOLO un objeto JSON con estas claves (todas texto):
matricula, marca, modelo, anio, cliente, bastidor, color, tipo, fecha_primera_matriculacion, fecha_matriculacion, fecha_expedicion, lugar_expedicion, validez, homologacion, servicio, cilindrada, potencia, combustible, masa_max_tecnica, masa_max_circulacion, masa_servicio, plazas, plazas_pie, proxima_itv, km_documento, clasificacion, tara, neumaticos, motor_marca, codigo_motor, cilindros, potencia_fiscal, longitud, anchura, altura, fecha_ficha, avisos.

    catch(e){
      const why=e.status===429?'se ha agotado el límite gratuito de Gemini por ahora':e.status===400||e.status===401||e.status===403?'la clave de Gemini no es válida':'no se pudo conectar con Gemini ('+e.message+')';
      const d=await readPhotosLocal(list,onStatus);d._motor='lector local';d.avisos=[`Se ha usado el lector local porque ${why}.`,d.avisos].filter(Boolean).join(' ');return d;
    }
  }
  const d=await readPhotosLocal(list,onStatus);d._motor='lector local';return d;
}
/* ---------- resumen local de visitas anteriores ---------- */
function summarize(h){
  const motivos=[...new Set(h.map(v=>v.motivo).filter(Boolean))];
  const parts=[];
  parts.push(`${h.length} ${h.length===1?'visita anterior':'visitas anteriores'}`+(motivos.length?`: ${motivos.slice(0,5).map(m=>short(m,40)).join(', ')}${motivos.length>5?'…':''}.`:'.'));
  const dan=h.filter(v=>v.danado);if(dan.length)parts.push(`Entró con daños ${dan.length===1?'una vez':dan.length+' veces'} (${short(dan[0].danos||'sin descripción',60)}).`);
  const last=h[0];const lastNote=last.notaSalida||last.observaciones;
  if(lastNote)parts.push(`Última anotación (${fmtD(last.fechaEntrada)}): ${short(lastNote,140)}`);
  const kms=h.map(v=>parseInt(String(v.km).replace(/\D/g,''))).filter(n=>n>0);if(kms.length)parts.push(`Últimos km registrados: ${Math.max(...kms).toLocaleString('es-ES')}.`);
  return parts.join(' ');
}

/* ---------- navegación ---------- */

function nav(v){$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));window.scrollTo(0,0)}

/* ---------- lista y búsqueda ---------- */
function haystack(e){const v=e.vehiculo||{};return [...VKEYS.map(k=>v[k]),e.cliente,e.telefono,e.motivo,e.observaciones,e.danos,(e.extras||[]).map(x=>x.desc).join(' '),e.notaSalida,fmtD(e.fechaEntrada)].join(' ').toLowerCase()+' '+normP(v.matricula).toLowerCase()}
function viewList(){
  nav('list');

  if(S.f===null)S.f=nIn?'taller':'todas';
  $('#app').innerHTML=`<div class="search"><input id="q" type="search" placeholder="Buscar por matrícula, marca, modelo, cliente, motivo…" value="${esc(S.q)}"></div>
  <div class="chips"><button data-f="taller" class="${S.f==='taller'?'on':''}">En taller · ${nIn}</button><button data-f="todas" class="${S.f==='todas'?'on':''}">Todas · ${ENT.length}</button></div>
  <div id="cards"></div>`;
  $('#q').oninput=e=>{S.q=e.target.value;renderCards()};
  $$('.chips button').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;viewList()});

function renderCards(){
  const toks=S.q.toLowerCase().split(/\s+/).filter(Boolean);
  let l=ENT.filter(e=>S.q||S.f==='todas'||e.estado==='taller');
  if(toks.length)l=l.filter(e=>{const h=haystack(e);return toks.every(t=>h.includes(t)||(normP(t)&&h.includes(normP(t).toLowerCase())))});
  l.sort((a,b)=>b.fechaEntrada.localeCompare(a.fechaEntrada));
  const box=$('#cards');
  if(!l.length){box.innerHTML=`<div class="card empty"><em>${ENT.length?'🔎':'🚗'}</em><p>${ENT.length?'No hay resultados.':'Todavía no hay entradas registradas.'}</p>${ENT.length?'':'<button class="btn pri" id="go">+ Nueva entrada</button>'}</div>`;const g=$('#go');if(g)g.onclick=()=>viewForm();return}
  const visits=p=>ENT.filter(x=>normP(x.vehiculo?.matricula)===p).length;
  box.innerHTML=l.map(e=>{const v=e.vehiculo||{};const n=visits(normP(v.matricula));return `<div class="card item" data-id="${e.id}">
    <div class="thumb" data-ph="${esc(e.fotos?.vehiculo||'')}">🚗</div>
    <div class="info"><div class="row"><span class="plate"><b>${esc(v.matricula||'—')}</b></span>${e.estado==='taller'?'<span class="tag in">En taller</span>':'<span class="tag out">Entregado</span>'}${e.danado?'<span class="tag red">Dañado</span>':''}${n>1?`<span class="tag" style="background:#eef2ff;color:#4338ca">${n} visitas</span>`:''}</div>
    <div class="t">${esc([v.marca,v.modelo,v.anio].filter(Boolean).join(' ')||'Sin marca/modelo')}</div>
    <div class="muted small">${fmt(e.fechaEntrada)}${e.cliente?' · '+esc(e.cliente):''}${e.motivo?' · '+esc(short(e.motivo,50)):''}</div></div></div>`}).join('');
  $$('.item',box).forEach(c=>c.onclick=()=>viewDetail(c.dataset.id));
  $$('[data-ph]',box).forEach(async t=>{const u=await photoURL(t.dataset.ph);if(u){const i=document.createElement('img');i.className='thumb';i.src=u;t.replaceWith(i)}});
}

/* ---------- historial de un vehículo ---------- */
function historyFor(plate,exclude){const p=normP(plate);if(p.length<4)return[];return ENT.filter(x=>x.id!==exclude&&normP(x.vehiculo?.matricula)===p).sort((a,b)=>b.fechaEntrada.localeCompare(a.fechaEntrada))}
function renderHistory(el,plate,exclude,opts={}){
  const h=historyFor(plate,exclude);
  if(!h.length){el.innerHTML='';return h}
  const first=h[h.length-1],last=h[0];
  el.innerHTML=`<section class="card hist"><h3>⚠️ ${opts.title||'Este vehículo ya ha estado en el taller'} ${h.length} ${h.length===1?'vez':'veces'}</h3>
   <div class="small muted">Primera visita: <b>${fmtD(first.fechaEntrada)}</b> · Última: <b>${fmtD(last.fechaEntrada)}</b>${last.cliente?` · Cliente: <b>${esc(last.cliente)}</b>`:''}</div>
   <div class="sum"><b>Resumen:</b> ${esc(summarize(h))}</div>
   ${opts.fill?'<button class="btn sm noprint" id="fillLast">Rellenar con los datos de la última visita</button>':''}
   <ul class="visits">${h.map(v=>`<li><div class="vd">${fmt(v.fechaEntrada)}${v.fechaSalida?' → '+fmtD(v.fechaSalida):' · <span style="color:var(--ac)">en taller</span>'}</div>
     <div><b>${esc(v.motivo||'Sin motivo anotado')}</b>${v.km?` · ${esc(v.km)} km`:''} ${v.danado?'<span class="tag red">Dañado</span>':''}</div>
     ${v.observaciones?`<div class="muted small">${esc(short(v.observaciones,160))}</div>`:''}
     ${opts.links?`<button class="link noprint" data-open="${v.id}">Ver entrada →</button>`:''}</li>`).join('')}</ul></section>`;
  $$('[data-open]',el).forEach(b=>b.onclick=()=>viewDetail(b.dataset.open));
  return h;
}

   <div><dt>Kilómetros</dt><dd>${esc(e.km||'—')}</dd></div><div><dt>Cliente</dt><dd>${esc(e.cliente||'—')}</dd></div>
   <div><dt>Teléfono</dt><dd>${e.telefono?`<a href="tel:${esc(e.telefono)}">${esc(e.telefono)}</a>`:'—'}</dd></div><div><dt>Motivo</dt><dd>${esc(e.motivo||'—')}</dd></div></dl>
   ${e.danado?`<div class="ai err" style="margin-top:12px"><b>Entra con daños${dmgs.length?' ('+dmgs.length+')':''}</b></div><div id="dview">${dmgs.map((d,i)=>`<div class="dview">${d.foto?`<img data-ph="${esc(d.foto)}" alt="">`:''}<div><b>Daño ${i+1}</b><div class="note">${esc(d.texto||'Sin descripción')}</div></div></div>`).join('')}</div>`:'<div class="ai ok" style="margin-top:12px">Sin daños al entrar</div>'}
   <h3 style="margin-top:16px">Observaciones</h3><div class="note">${esc(e.observaciones||'—')}</div>
   ${e.notaSalida?`<h3 style="margin-top:16px">Nota de salida</h3><div class="note">${esc(e.notaSalida)}</div>`:''}</section>
  <section class="card" id="galBox" hidden><h3>Fotos</h3><div class="gal" id="gal"></div></section>
  ${ficha?`<section class="card"><h3>Datos de la ficha técnica</h3><dl class="dl">${ficha}</dl></section>`:''}
  <div id="hist"></div>`;
  // fotos
  const gal=$('#gal');for(const [k,l] of [['vehiculo','Vehículo'],['ficha','Ficha técnica / permiso']]){const u=await photoURL(e.fotos?.[k]);if(u){$('#galBox').hidden=false;gal.insertAdjacentHTML('beforeend',`<figure><img src="${u}"><figcaption>${l}</figcaption></figure>`)}}
  for(const x of e.extras||[]){const u=await photoURL(x.id);if(u){$('#galBox').hidden=false;gal.insertAdjacentHTML('beforeend',`<figure><img src="${u}"><figcaption>${esc(x.desc||'Foto del vehículo')}</figcaption></figure>`)}}
  for(const im of $$('#dview img[data-ph]')){const u=await photoURL(im.dataset.ph);if(u){im.src=u;im.onclick=()=>lightbox(u)}else im.remove()}
  $$('img',gal).forEach(i=>i.onclick=()=>lightbox(i.src));
  renderHistory($('#hist'),v.matricula,e.id,{title:'Otras visitas de este vehículo:',links:true});
  $('#edit').onclick=()=>viewForm(e);
  $('#print').onclick=()=>window.print();
  $('#del').onclick=async()=>{if(!confirm('¿Eliminar esta entrada y sus fotos?'))return;for(const id of [...Object.values(e.fotos||{}),...(e.extras||[]).map(x=>x.id),...(e.danosList||[]).map(d=>d.foto)].filter(Boolean))await DB.del('fotos',id);await DB.del('entradas',e.id);ENT=ENT.filter(x=>x.id!==e.id);toast('Entrada eliminada');viewList()};
  const save=async()=>{e.actualizado=new Date().toISOString();await DB.put('entradas',e);viewDetail(e.id)};
  if($('#reopen'))$('#reopen').onclick=async()=>{e.estado='taller';e.fechaSalida=null;await save();toast('Entrada abierta de nuevo')};
  if($('#out'))$('#out').onclick=()=>{
    $('#outBox').innerHTML=`<section class="card" style="border-color:var(--ac)"><h3>Registrar salida</h3><div class="grid">
     <label class="f"><span>Fecha y hora de salida</span><input id="fs" type="datetime-local" value="${toLocalInput()}"></label></div>
     <label class="f" style="display:block;margin-top:12px"><span>Nota de salida (trabajo hecho, avisos al cliente…)</span><textarea id="ns" rows="3"></textarea></label>
     <div class="actions"><button class="btn" id="oc">Cancelar</button><button class="btn pri" id="ok">Confirmar salida</button></div></section>`;
    $('#ns').focus();$('#oc').onclick=()=>$('#outBox').innerHTML='';
    $('#ok').onclick=async()=>{e.estado='entregado';e.fechaSalida=fromLocalInput($('#fs').value);e.notaSalida=$('#ns').value.trim();await save();toast('Salida registrada')};
  };
}

/* ---------- ajustes y copias ---------- */
function viewSettings(){
  nav('settings');
  $('#app').innerHTML=`<h2>Ajustes</h2>
  <section class="card"><h3>Lectura con IA gratuita (Gemini)</h3>
   <p class="small" style="margin-top:0">Lee la matrícula, el permiso de circulación y la ficha técnica mucho mejor que el lector local (bastidor, neumáticos, motor…). Es gratis con tu cuenta de Google:</p>
   <ol class="small" style="margin:0 0 12px;padding-left:20px;line-height:1.7"><li>Entra en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con tu cuenta de Google.</li><li>Pulsa <b>Crear clave de API</b> (Create API key) y cópiala.</li><li>Pégala aquí y pulsa <b>Guardar y probar</b>.</li></ol>
   <label class="f"><span>Clave de Gemini</span><input id="gk" type="password" value="${esc(gemKey())}" placeholder="AIza…" autocomplete="off"></label>
   <div class="actions" style="justify-content:flex-start"><button class="btn pri" id="gsave">Guardar y probar</button><button class="btn" id="gdel">Quitar clave</button></div>
   <div id="gst" class="ai" style="display:${gemKey()?'block':'none'}">${gemKey()?'Clave guardada'+(store.get('tr_gmodel')?' · modelo '+esc(store.get('tr_gmodel')):''):''}</div>
   <p class="muted small" style="margin:12px 0 0">Las fotos se envían a Google para leerlas. Según sus condiciones, para usuarios en España (EEE) aplica sus reglas de datos del plan de pago también al uso gratuito, pero recuerda que el permiso lleva el nombre del cliente. La clave es para tu uso: no compartas esta página con la clave puesta. Se guarda solo en este navegador. Si no hay internet, se agota el límite gratuito o quitas la clave, se usa el lector local.</p></section>
  <section class="card"><h3>Lector local (sin internet)</h3>
   <p class="muted small" style="margin:0">Tesseract (open source) dentro del navegador. Se usa si no hay clave de Gemini o si falla. La primera vez necesita internet para descargarse.</p></section>
  <section class="card"><h3>Copia de seguridad</h3>
   <p class="muted small" style="margin-top:0">Los datos y las fotos se guardan en este navegador. Descarga copias a menudo y guárdalas en tus discos.</p>
   <p><b>${ENT.length}</b> entradas registradas.</p>
   <div class="actions" style="justify-content:flex-start"><button class="btn pri" id="exp">Descargar copia</button><label class="btn">Restaurar copia<input id="imp" type="file" accept=".json" hidden></label></div>
   <div id="bk" class="muted small" style="margin-top:8px"></div></section>`;
  $('#gsave').onclick=async()=>{
    const k=$('#gk').value.trim(),st=$('#gst');st.style.display='block';
    if(!k){st.className='ai err';st.textContent='Pega primero la clave.';return}
    store.set('tr_gkey',k);store.set('tr_gmodel','');st.className='ai';st.innerHTML='<span class="spin"></span>Comprobando la clave…';
    try{const m=await gemModels();if(!m.length)throw new Error('la clave no tiene modelos disponibles');store.set('tr_gmodel',m[0]);st.className='ai ok';st.textContent='✓ Clave correcta. Se usará el modelo '+m[0]+'.'}
    catch(e){st.className='ai err';st.textContent='No funciona: '+e.message}
  };
  $('#gdel').onclick=()=>{store.set('tr_gkey','');store.set('tr_gmodel','');$('#gk').value='';const st=$('#gst');st.style.display='block';st.className='ai';st.textContent='Clave quitada. Se usará el lector local.'};
  $('#exp').onclick=async()=>{
    $('#bk').innerHTML='<span class="spin"></span>Preparando copia…';
    const fotos=await DB.all('fotos');const out=[];
    for(const f of fotos)out.push({id:f.id,data:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f.blob)})});
    const blob=new Blob([JSON.stringify({version:1,fecha:new Date().toISOString(),entradas:ENT,fotos:out})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`registro-taller-${new Date().toISOString().slice(0,10)}.json`;a.click();
    $('#bk').textContent='Copia descargada ('+(blob.size/1048576).toFixed(1)+' MB).';
  };
  $('#imp').onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;
    try{$('#bk').innerHTML='<span class="spin"></span>Restaurando…';const d=JSON.parse(await f.text());
      for(const p of d.fotos||[]){const b=await (await fetch(p.data)).blob();await DB.put('fotos',{id:p.id,blob:b});delete urlCache[p.id]}
      for(const e of d.entradas||[])await DB.put('entradas',e);
      ENT=await DB.all('entradas');toast('Copia restaurada');viewSettings();
    }catch(err){$('#bk').textContent='No se pudo restaurar: '+err.message}
  };
}

/* ---------- inicio ---------- */
(async()=>{
  try{await DB.open();ENT=await DB.all('entradas');if(navigator.storage?.persist)navigator.storage.persist();viewList()}
  catch(err){$('#app').innerHTML=`<div class="card empty"><em>⚠️</em><p>Este navegador no permite guardar datos: ${esc(err.message)}</p></div>`}
})();
</script>
</body>
</html>
